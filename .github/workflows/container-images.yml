name: container-images
on:
  workflow_dispatch:
permissions: {contents: read}
concurrency:
  group: container-images-${{ github.ref }}
  cancel-in-progress: false
jobs:
  verify:
    uses: ./.github/workflows/dependency-security.yml
  publish:
    needs: verify
    if: github.ref_name == github.event.repository.default_branch && vars.DEPLOYMENT_PROVIDER == 'digitalocean'
    environment: container-images
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      DOCR_REGISTRY: ${{ vars.DOCR_REGISTRY }}
      IMAGE_TAG: ${{ github.sha }}-${{ github.run_id }}-${{ github.run_attempt }}
      IMAGE_NAME: mindbliss-client
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with: {persist-credentials: false}
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with: {node-version: "24"}
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4
      - run: '[[ "$DOCR_REGISTRY" =~ ^[a-z0-9][a-z0-9-]{1,61}[a-z0-9]$ ]]'
      - uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6 # v4
        with:
          registry: registry.digitalocean.com
          username: ${{ secrets.DOCR_USERNAME }}
          password: ${{ secrets.DOCR_WRITE_TOKEN }}
      - uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7
        with:
          context: .
          target: runtime
          platforms: linux/amd64
          load: true
          push: false
          provenance: false
          tags: registry.digitalocean.com/${{ vars.DOCR_REGISTRY }}/mindbliss-client:${{ env.IMAGE_TAG }}
          labels: |
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
      - name: Test exact runtime candidate, without secrets or internet
        run: |
          set -euo pipefail
          image="registry.digitalocean.com/$DOCR_REGISTRY/$IMAGE_NAME:$IMAGE_TAG"
          id=$(docker run -d --network none --read-only --tmpfs /tmp --tmpfs /app/.next/cache "$image")
          trap 'docker rm -f "$id" >/dev/null' EXIT
          for _attempt in $(seq 1 30); do
            if docker exec "$id" node -e 'fetch("http://127.0.0.1:3000/login").then(r=>process.exit(r.status===200?0:1)).catch(()=>process.exit(1))'; then exit 0; fi
            sleep 2
          done
          exit 1
      - name: Publish and record the tested digest
        run: |
          set -euo pipefail
          docker push "registry.digitalocean.com/$DOCR_REGISTRY/$IMAGE_NAME:$IMAGE_TAG"
          node --input-type=module <<'JS'
          import { execFileSync } from 'node:child_process';
          import { writeFileSync } from 'node:fs';
          import assert from 'node:assert/strict';
          const { DOCR_REGISTRY: registry, IMAGE_NAME: repository, IMAGE_TAG: tag, GITHUB_SHA: commit, GITHUB_REPOSITORY: source } = process.env;
          const prefix = `registry.digitalocean.com/${registry}/${repository}`;
          const image = JSON.parse(execFileSync('docker', ['image', 'inspect', `${prefix}:${tag}`], {encoding:'utf8'}))[0];
          assert.equal(`${image.Os}/${image.Architecture}`, 'linux/amd64');
          assert.equal(image.Config.Labels['org.opencontainers.image.revision'], commit);
          const pinned = image.RepoDigests.find(ref => ref.startsWith(prefix + '@sha256:'));
          assert.ok(pinned);
          const manifest = JSON.parse(execFileSync('docker', ['buildx', 'imagetools', 'inspect', '--raw', pinned], {encoding:'utf8'}));
          assert.equal(manifest.config.digest, image.Id);
          writeFileSync('client-image-lock.json', JSON.stringify({format:1, platform:'linux/amd64', registry,
            images:{client:{repository,digest:pinned.split('@')[1],commit,source}}}, null, 2), {flag:'wx'});
          JS
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: client-image-lock
          path: client-image-lock.json
          if-no-files-found: error
          retention-days: 30
