name: deploy

# staging → EC2 staging · main → EC2 prod. Los boxes NO son alcanzables por SSH
# desde los runners de GitHub (puerto 22 filtrado), así que el deploy va por
# AWS SSM: tar del source → S3 (URL presignada) → RunShellScript en el box
# (extraer + npm ci + build + restart mindbliss-web + health check).
# Auth = OIDC → rol gh-mindbliss-front-deploy (sin llaves SSH ni access keys).
# Los .env.local viven en el server (no en CI).
on:
  push:
    branches: [main, staging]
  workflow_dispatch:
    inputs:
      environment:
        description: "staging|prod"
        required: true
        default: staging
        type: choice
        options:
          - staging
          - prod

concurrency:
  group: deploy-front-${{ github.event_name == 'workflow_dispatch' && inputs.environment || github.ref_name }}
  cancel-in-progress: false

permissions:
  id-token: write
  contents: read

env:
  AWS_REGION: us-east-1
  ARTIFACT_BUCKET: vp-deploy-artifacts-522814703714

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      # Gate de tests + build: corre las pruebas unitarias y compila EN EL RUNNER
      # antes de tocar el box. Cualquier rotura (test o build) aborta el deploy
      # aquí (rápido, sin consumir CPU del servidor que sirve a los miembros); el
      # box igual re-construye con sus .env reales. Ningún push llega a prod sin
      # pasar los tests.
      # node 22 = misma versión que el box en prod; además `node --test` sólo
      # expande el glob "src/**/*.test.mjs" en node 21+ (en 20 falla el gate).
      - uses: actions/setup-node@v7
        with: { node-version: 22 }
      - name: Install deps
        run: npm ci --no-audit --no-fund
      - name: Test gate
        run: npm test
      - name: Build gate
        run: npm run build

      - name: Resolve target instance
        id: t
        env:
          EVENT_NAME: ${{ github.event_name }}
          REF_NAME: ${{ github.ref_name }}
          INPUT_ENV: ${{ inputs.environment || '' }}
        run: |
          if [ "$EVENT_NAME" = "workflow_dispatch" ]; then
            env_norm="$(printf '%s' "$INPUT_ENV" | tr '[:upper:]' '[:lower:]')"
          elif [ "$REF_NAME" = "main" ]; then
            env_norm=prod
          else
            env_norm=staging
          fi

          case "$env_norm" in
            prod|production) env_norm=prod ;;
            staging|stage) env_norm=staging ;;
            *) echo "environment invalido: '$INPUT_ENV'"; exit 1 ;;
          esac

          if [ "$EVENT_NAME" = "workflow_dispatch" ] && [ "$env_norm" = "prod" ] && [ "$REF_NAME" != "main" ]; then
            echo "Los deploys manuales a prod deben ejecutarse desde la rama main"
            exit 1
          fi

          if [ "$env_norm" = "prod" ]; then
            echo "instance=i-060e76a6c26bded35" >> "$GITHUB_OUTPUT"; echo "env=prod" >> "$GITHUB_OUTPUT"
          else
            echo "instance=i-0f7f6c73503537d73" >> "$GITHUB_OUTPUT"; echo "env=staging" >> "$GITHUB_OUTPUT"
          fi

      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: arn:aws:iam::522814703714:role/gh-mindbliss-front-deploy
          aws-region: ${{ env.AWS_REGION }}

      - name: Upload artifact to S3
        id: art
        run: |
          tar -czf /tmp/web.tar.gz --exclude=node_modules --exclude=.next --exclude=.git .
          KEY="front/${{ steps.t.outputs.env }}-${{ github.sha }}.tar.gz"
          aws s3 cp /tmp/web.tar.gz "s3://$ARTIFACT_BUCKET/$KEY" --only-show-errors
          URL=$(aws s3 presign "s3://$ARTIFACT_BUCKET/$KEY" --expires-in 1200)
          echo "key=$KEY" >> "$GITHUB_OUTPUT"
          echo "url=$URL" >> "$GITHUB_OUTPUT"

      - name: Deploy via SSM (${{ steps.t.outputs.env }})
        run: |
          printf "ARTIFACT_URL='%s'\n" "${{ steps.art.outputs.url }}" > /tmp/deploy.sh
          cat >> /tmp/deploy.sh <<'EOS'
          set -euo pipefail
          target=/opt/mindbliss/web
          case "$target" in /opt/mindbliss/web) ;; *) echo "target invalido: $target"; exit 1 ;; esac
          curl -fsSL "$ARTIFACT_URL" -o /tmp/web.tar.gz
          sudo -u ubuntu bash -c '
            set -euo pipefail
            target=/opt/mindbliss/web
            find "$target" -mindepth 1 -maxdepth 1 \
              ! -name ".env" \
              ! -name ".env.local" \
              ! -name "node_modules" \
              -exec rm -rf {} +
            tar -xzf /tmp/web.tar.gz -C "$target"
          '
          rm -f /tmp/web.tar.gz
          sudo -u ubuntu bash -c 'cd /opt/mindbliss/web && npm ci --no-audit --no-fund && npm run build' > /tmp/web-build.log 2>&1 || { tail -80 /tmp/web-build.log; exit 1; }
          systemctl restart mindbliss-web
          sleep 6
          curl -fsS http://127.0.0.1:3000/health >/dev/null && echo "mindbliss-web OK" || { echo "HEALTH FAIL"; journalctl -u mindbliss-web -n 20 --no-pager; exit 1; }
          EOS
          {
            echo "cat > /tmp/mindbliss-front-deploy.sh <<'REMOTE_DEPLOY'"
            cat /tmp/deploy.sh
            echo "REMOTE_DEPLOY"
            echo "bash /tmp/mindbliss-front-deploy.sh"
            echo "rm -f /tmp/mindbliss-front-deploy.sh"
          } > /tmp/ssm-commands.sh
          jq -Rn --rawfile script /tmp/ssm-commands.sh '{commands: ($script | split("\n"))}' > /tmp/params.json

          CMD_ID=$(aws ssm send-command \
            --instance-ids "${{ steps.t.outputs.instance }}" \
            --document-name AWS-RunShellScript \
            --timeout-seconds 1500 \
            --parameters file:///tmp/params.json \
            --query "Command.CommandId" --output text)
          echo "SSM command: $CMD_ID"

          STATUS=InProgress
          for i in $(seq 1 90); do
            sleep 15
            STATUS=$(aws ssm get-command-invocation --command-id "$CMD_ID" \
              --instance-id "${{ steps.t.outputs.instance }}" --query Status --output text 2>/dev/null || echo Pending)
            echo "[$i] status=$STATUS"
            case "$STATUS" in InProgress|Pending|Delayed) continue ;; *) break ;; esac
          done

          aws ssm get-command-invocation --command-id "$CMD_ID" \
            --instance-id "${{ steps.t.outputs.instance }}" \
            --query "{Status:Status,Stdout:StandardOutputContent,Stderr:StandardErrorContent}" --output json | tee /tmp/result.json
          test "$(jq -r .Status /tmp/result.json)" = "Success"
          jq -r .Stdout /tmp/result.json | grep -q "mindbliss-web OK"

      - name: Cleanup artifact
        if: always()
        run: |
          if [ -n "${{ steps.art.outputs.key }}" ]; then
            aws s3 rm "s3://$ARTIFACT_BUCKET/${{ steps.art.outputs.key }}" --only-show-errors || true
          fi
